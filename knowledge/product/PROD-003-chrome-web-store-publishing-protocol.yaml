id: "PROD-003"
type: "product"
title: "Chrome Web Store Publishing and Zero-Privilege Distribution Protocol"
domain: "distribution-compliance"
status: "approved"
version: "1.1.0"
rule: "All store releases must package pre-rendered PNG icon assets at mandatory sizes (16, 48, 128px), display prominent, copyable Viewer Web App access URLs across host interfaces, default to live production SSL cloud relays, exclude build artifacts from upload archives, provide individual user-facing justifications for every requested permission, and link to a live, compliant HTTPS Privacy Policy."
do:
  - "Maintain CHROMEWEBSTORE.md as the canonical source of truth for store copy, permissions justifications, and privacy disclosures."
  - "Generate real PNG icons at 16×16, 48×48, and 128×128 dimensions and declare them in manifest.json under 'icons' and 'action.default_icon'."
  - "Display prominent, interactive Viewer Web App URLs with 1-click copy and launch buttons in the host panel header, universal access box, account dashboard, and PIN mode."
  - "Default host and viewer signaling endpoints to the live SSL cloud relay (wss://) for instant, zero-configuration out-of-the-box operation."
  - "Provide specific user-benefit justifications for desktopCapture, tabs, scripting, storage, offscreen, and <all_urls> without technical implementation jargon."
  - "Host a live, public Privacy Policy URL on the cloud relay server (/privacy) and GitHub repository."
  - "Package clean extension archives excluding .git/, node_modules/, tests, and development configuration scripts."
dont:
  - "Do not submit packages referencing missing icon files or SVG files in manifest icons."
  - "Do not provide generic justifications like 'required for functionality' or 'needed to work'."
  - "Do not default signaling URLs to localhost in production extension builds."
  - "Do not hide or omit the Remote Viewer Web App link from the host user interface."
reason: "Chrome Web Store review compliance and user adoption require out-of-the-box functionality; missing viewer URLs confuse users on how to connect from secondary devices, while localhost defaults break non-admin cloud deployment."
related_items:
  - "PROD-001"
  - "DEV-002"
  - "DEV-007"
  - "ARCH-003"


id: "PROD-003"
type: "product"
title: "Chrome Web Store Publishing and Zero-Privilege Distribution Protocol"
domain: "distribution-compliance"
status: "approved"
version: "1.0.0"
rule: "All store releases must package pre-rendered PNG icon assets at mandatory sizes (16, 48, 128px), exclude developer and repository build artifacts from upload archives, provide individual user-facing justifications for every requested permission and host permission, and link to a live, compliant HTTPS Privacy Policy."
do:
  - "Maintain CHROMEWEBSTORE.md as the canonical source of truth for store copy, permissions justifications, and privacy disclosures."
  - "Generate real PNG icons at 16×16, 48×48, and 128×128 dimensions and declare them in manifest.json under 'icons' and 'action.default_icon'."
  - "Provide specific user-benefit justifications for desktopCapture, tabs, scripting, storage, offscreen, and <all_urls> without technical implementation jargon."
  - "Host a live, public Privacy Policy URL on the cloud relay server (/privacy) and GitHub repository."
  - "Package clean extension archives excluding .git/, node_modules/, tests, and development configuration scripts."
dont:
  - "Do not submit packages referencing missing icon files or SVG files in manifest icons."
  - "Do not provide generic justifications like 'required for functionality' or 'needed to work'."
  - "Do not bundle remote script tags or unbundled CDN dependencies in the extension package."
reason: "Chrome Web Store automated scans and human review teams reject submissions lacking real icons, specific permission justifications, or live privacy policies; meeting these criteria ensures rapid approval and unblocked enterprise rollout."
related_items:
  - "PROD-001"
  - "DEV-002"
  - "ARCH-003"

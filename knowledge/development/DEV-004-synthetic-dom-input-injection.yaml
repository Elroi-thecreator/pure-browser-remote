id: "DEV-004"
type: "development"
title: "Content Script Synthetic DOM Event Injection and Element Targeting Protocol"
domain: "input-simulation"
status: "approved"
version: "1.1.0"
rule: "Input events simulated via content scripts must target the active element under normalized viewport coordinates, resolve valid external web tabs rather than internal extension pages, and dispatch standard synthetic DOM events with native prototype value descriptor synchronization for SPA frameworks."
do:
  - "Filter out chrome://, edge://, and chrome-extension:// tabs to guarantee inputs route to the actual target web page."
  - "Translate normalized coordinates (x, y) into client coordinates using window.innerWidth and window.innerHeight."
  - "Identify the DOM node using document.elementFromPoint(clientX, clientY) and maintain tracking of the last interacted input element."
  - "Call Object.getOwnPropertyDescriptor(prototype, 'value').set to ensure React, Vue, Svelte, and Angular internal trackers update component state."
  - "Dispatch beforeinput, input, and change events when injecting text to ensure two-way binding models synchronize."
  - "Support direct physical keyboard typing capture over WebRTC DataChannel alongside modal text injection."
  - "Trigger form.requestSubmit() or synthetic submit button clicks when Enter is pressed in search and form inputs."
  - "Display a non-intrusive visual remote pointer indicator in the active page for host user awareness."
dont:
  - "Do not set input.value without dispatching InputEvent and Event('change', { bubbles: true })."
  - "Do not dispatch remote inputs to chrome-extension:// or internal host control center tabs."
  - "Do not let synthetic pointer markers intercept elementFromPoint queries (use pointer-events: none)."
reason: "Modern Single Page Applications (SPAs) rely on synthetic event listeners and virtual DOM reconciliation; setting direct properties without invoking native prototype setters and beforeinput/input events causes React and Angular to drop or overwrite injected text."
related_items:
  - "DEV-001"
  - "ARCH-003"


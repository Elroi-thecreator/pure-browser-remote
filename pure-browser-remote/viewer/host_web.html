<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pure Web Host - Zero-Install Screen Sharing (Non-Admin)</title>
  <style>
    :root {
      --bg: #090d16;
      --card: #131b2e;
      --border: rgba(255, 255, 255, 0.1);
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --success: #10b981;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px;
      width: 100%;
      max-width: 520px;
      box-shadow: 0 20px 45px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .header { text-align: center; }
    .icon { font-size: 2.5rem; margin-bottom: 6px; }
    h1 { font-size: 1.4rem; font-weight: 700; color: #fff; }
    .badge {
      display: inline-block;
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      margin-top: 6px;
    }
    .pin-box {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .pin-label { font-size: 0.75rem; text-transform: uppercase; color: var(--text-muted); font-weight: 600; }
    .pin-val { font-family: var(--font-mono); font-size: 2.2rem; font-weight: 700; letter-spacing: 6px; color: #60a5fa; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      padding: 12px 20px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s ease;
      width: 100%;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-danger { background: #ef4444; color: #fff; }
    .status-text { font-size: 0.85rem; color: var(--text-muted); text-align: center; }
    .video-preview {
      width: 100%;
      height: 180px;
      background: #000;
      border-radius: 8px;
      border: 1px solid var(--border);
      object-fit: contain;
      display: none;
    }
    .hint { font-size: 0.8rem; color: var(--text-muted); line-height: 1.4; text-align: center; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="icon">🚀</div>
      <h1>Zero-Install Web Screen Sharing</h1>
      <span class="badge">100% No-Admin Web Page Mode</span>
    </div>

    <p class="hint">
      No extension or software installation needed. Uses standard browser screen capture to stream directly to your remote viewer phone or computer.
    </p>

    <div class="pin-box">
      <span class="pin-label">Room PIN</span>
      <div class="pin-val" id="pinDisplay">------</div>
      <div style="font-size:0.8rem; color:var(--text-muted);">Share this PIN with your viewer</div>
    </div>

    <video id="previewVideo" class="video-preview" autoplay muted playsinline></video>

    <button id="btnStart" class="btn btn-primary">🎥 Share Screen & Start Hosting</button>
    <button id="btnStop" class="btn btn-danger hidden">🛑 Stop Hosting</button>

    <div class="status-text" id="statusLabel">Ready to connect.</div>
  </div>

  <script>
    (function() {
      const pinDisplay = document.getElementById('pinDisplay');
      const btnStart = document.getElementById('btnStart');
      const btnStop = document.getElementById('btnStop');
      const statusLabel = document.getElementById('statusLabel');
      const previewVideo = document.getElementById('previewVideo');

      let currentPin = Math.floor(100000 + Math.random() * 900000).toString();
      pinDisplay.textContent = currentPin;

      let ws = null;
      let pc = null;
      let captureStream = null;

      const wsProto = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      const wsUrl = `${wsProto}//${window.location.host}`;

      btnStart.addEventListener('click', async () => {
        try {
          captureStream = await navigator.mediaDevices.getDisplayMedia({
            video: { cursor: 'always', frameRate: { ideal: 60, max: 60 } },
            audio: false
          });

          previewVideo.srcObject = captureStream;
          previewVideo.style.display = 'block';
          btnStart.classList.add('hidden');
          btnStop.classList.remove('hidden');
          statusLabel.textContent = 'Screen captured. Connecting to signaling...';

          connectSignaling();
        } catch (err) {
          statusLabel.textContent = 'Screen share cancelled or failed: ' + err.message;
        }
      });

      function connectSignaling() {
        ws = new WebSocket(wsUrl);

        ws.onopen = () => {
          statusLabel.textContent = `Awaiting viewer on PIN: ${currentPin}`;
          ws.send(JSON.stringify({ type: 'register-host', pin: currentPin }));
        };

        ws.onmessage = async (e) => {
          const msg = JSON.parse(e.data);
          if (msg.type === 'viewer-joined') {
            statusLabel.textContent = 'Viewer connected! Streaming live WebRTC...';
            initiatePeerConnection();
          } else if (msg.type === 'signal') {
            if (!pc) return;
            if (msg.data.type === 'answer') {
              await pc.setRemoteDescription(new RTCSessionDescription(msg.data));
            } else if (msg.data.type === 'ice-candidate') {
              await pc.addIceCandidate(new RTCIceCandidate(msg.data.candidate));
            }
          } else if (msg.type === 'viewer-disconnected') {
            statusLabel.textContent = `Viewer disconnected. Awaiting reconnect (PIN: ${currentPin})`;
            if (pc) { pc.close(); pc = null; }
          }
        };

        ws.onerror = () => { statusLabel.textContent = 'Signaling relay connection error.'; };
      }

      async function initiatePeerConnection() {
        pc = new RTCPeerConnection({
          iceServers: [
            { urls: 'stun:stun.l.google.com:19302' },
            { urls: 'stun:stun1.l.google.com:19302' }
          ]
        });

        if (captureStream) {
          captureStream.getTracks().forEach(track => pc.addTrack(track, captureStream));
        }

        pc.onicecandidate = (e) => {
          if (e.candidate) {
            ws.send(JSON.stringify({
              type: 'signal',
              data: { type: 'ice-candidate', candidate: e.candidate }
            }));
          }
        };

        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);

        ws.send(JSON.stringify({
          type: 'signal',
          data: { type: 'offer', sdp: offer.sdp }
        }));
      }

      btnStop.addEventListener('click', () => {
        if (captureStream) {
          captureStream.getTracks().forEach(t => t.stop());
          captureStream = null;
        }
        if (pc) { pc.close(); pc = null; }
        if (ws) { ws.close(); ws = null; }

        previewVideo.style.display = 'none';
        btnStart.classList.remove('hidden');
        btnStop.classList.add('hidden');
        statusLabel.textContent = 'Hosting stopped.';
      });
    })();
  </script>
</body>
</html>
